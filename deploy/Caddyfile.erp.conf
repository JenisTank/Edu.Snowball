# ─────────────────────────────────────────────────────────────
# BumbleB ERP — Caddy site block for the host Caddy on this VPS
#
# The box already runs Caddy 2.11 as a systemd service owning :80 and :443, with
# the existing project published on 127.0.0.1:8080. BumbleB follows the same
# pattern on 127.0.0.1:8082, so this block is additive: it names a different
# hostname and proxies to a different loopback port. Nothing about the existing
# site changes.
#
# Install (append to /etc/caddy/Caddyfile, after taking a backup):
#   sudo cp /etc/caddy/Caddyfile /etc/caddy/Caddyfile.bak.$(date +%F-%H%M)
#   sudo tee -a /etc/caddy/Caddyfile < deploy/Caddyfile.erp.conf
#   sudo caddy validate --config /etc/caddy/Caddyfile
#   sudo systemctl reload caddy
#
# Caddy obtains and renews the certificate by itself once DNS points here.
# DNS: edu.snowballconcepts.com -> this VPS's public IP (A record).
# ─────────────────────────────────────────────────────────────

edu.snowballconcepts.com {
	encode zstd gzip

	# The frontend container's nginx serves the SPA and proxies /api to the API
	# container, so this is the only upstream. One origin, no CORS anywhere.
	reverse_proxy 127.0.0.1:8082

	# The service worker must never be cached, or PWA updates get stuck.
	@sw path /sw.js
	header @sw Cache-Control "no-cache, no-store, must-revalidate"
}
