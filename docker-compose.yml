# BumbleB Kidz ERP — one command runs everything: docker compose up
# Production-shape stack: PostgreSQL 16 + Redis + NestJS API + Staff Portal/PWA
#
#   cp .env.example .env     # then set DB_PASSWORD + JWT_SECRET
#   docker compose up -d --build
#   docker compose exec api npx prisma migrate deploy   # first run only
#
# The SPA is served by nginx on :80, which proxies /api to the API container.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: bumbleb
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: bumblebkidz_erp
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bumbleb -d bumblebkidz_erp']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://bumbleb:${DB_PASSWORD}@db:5432/bumblebkidz_erp
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_EXPIRES: ${JWT_EXPIRES:-15m}
      PORT: 3000
      WA_BSP_KEY: ${WA_BSP_KEY:-}
      ONLINE_PAYMENT_CAP: ${ONLINE_PAYMENT_CAP:-200000}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
      APP_RELEASE: ${APP_RELEASE:-docker-compose}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@bumblebkidz.com}
      # DPDP: encrypts statutory PII at rest. env.ts only WARNS when this is
      # missing, so production loses encryption silently — always set it.
      PII_KEY: ${PII_KEY:-}
      RETENTION_MESSAGE_DAYS: ${RETENTION_MESSAGE_DAYS:-730}
      RETENTION_AUDIT_DAYS: ${RETENTION_AUDIT_DAYS:-2555}
      # WhatsApp transport: Evolution API first, Meta Cloud API as fallback.
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-}
      WA_PHONE_ID: ${WA_PHONE_ID:-}
      # UPI QR collection (no gateway): Head Office fallback VPA.
      UPI_VPA: ${UPI_VPA:-}
      UPI_PAYEE_NAME: ${UPI_PAYEE_NAME:-BumbleB Kidz}
      # Email fallback, used only when WhatsApp is unavailable.
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-BumbleB Kidz <no-reply@bumblebkidz.com>}
      # Student documents: local volume by default, S3 via these five.
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_DIR: /app/var/documents
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-ap-south-1}
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-}
      STORAGE_S3_ACCESS_KEY: ${STORAGE_S3_ACCESS_KEY:-}
      STORAGE_S3_SECRET_KEY: ${STORAGE_S3_SECRET_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '3000:3000'
    volumes:
      - documents:/app/var/documents
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '80:80'

volumes:
  pgdata:
  redisdata:
  documents:
