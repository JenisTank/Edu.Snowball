# BumbleB Kidz ERP — static hosting for the staff portal and the /parent PWA.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;

    # API — the SPA always calls a relative /api path, so no CORS in production.
    location /api/ {
        proxy_pass http://api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }

    # The service worker must never be cached, or PWA updates get stuck.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Fingerprinted build assets can be cached aggressively.
    location ~* \.(?:js|css|png|jpe?g|svg|gif|ico|woff2?|webmanifest)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Client-side routing: staff portal routes and the parent PWA at /parent.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
