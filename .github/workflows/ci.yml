name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API — typecheck + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json

      - run: npm ci --no-audit --no-fund

      # Prisma generates the typed client from schema.prisma — required before tsc.
      - run: npx prisma generate

      - run: npm run typecheck

      - run: npm test -- --ci

      - run: npx prettier --check "src/**/*.ts" "prisma/**/*.ts" "test/**/*.ts"

  database:
    name: Database — migrations apply cleanly
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bumbleb
          POSTGRES_PASSWORD: bumbleb
          POSTGRES_DB: bumblebkidz_erp
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports: ['5432:5432']
    defaults:
      run:
        working-directory: api
    env:
      DATABASE_URL: postgresql://bumbleb:bumbleb@localhost:5432/bumblebkidz_erp
      SHADOW_DATABASE_URL: postgresql://bumbleb:bumbleb@localhost:5432/bumbleb_shadow
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npx prisma generate

      # 1. the baseline must apply to an empty database
      - run: npx prisma migrate deploy

      # 2. migrations must still describe schema.prisma exactly (drift check)
      - run: |
          PGPASSWORD=bumbleb psql -h localhost -U bumbleb -d postgres -c 'CREATE DATABASE bumbleb_shadow;'
        env:
          DATABASE_URL: postgresql://bumbleb:bumbleb@localhost:5432/bumblebkidz_erp

      - run: |
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --exit-code

  web:
    name: Frontend — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund

      - run: npm run build

  format:
    name: Repo — prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npx --yes prettier@3 --check .
